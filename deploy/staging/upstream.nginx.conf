# Include at server scope in the private HTTPS staging listener.
location ~ ^/(?:v1/|health/(?:live|ready)$) {
    if ($metaguard_invalid_origin = 1) { return 403; }

    client_max_body_size 25m;
    proxy_pass https://__BACKEND_PRIVATE_IPV4__:8000;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8443;
    proxy_set_header Connection "";
    proxy_set_header Origin $metaguard_request_origin;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Real-IP "";

    proxy_ssl_server_name on;
    proxy_ssl_name metaguard-staging-api.internal;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_trusted_certificate /etc/metaguard-staging-ui/backend-ca.pem;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_connect_timeout 5s;
    proxy_read_timeout 150s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_redirect off;
}
