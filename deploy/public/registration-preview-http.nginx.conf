# Include in http, not in a server and not enabled by the committed public site.
map $remote_addr $metaguard_registration_operator {
    default 0;
    __REGISTRATION_CLIENT_IPV4__ 1;
}

map "$request_method:$request_uri" $metaguard_registration_route {
    default blocked;
    ~^GET:/v1/auth/status$ account;
    ~^POST:/v1/auth/(verify-email|login|logout)$ account;
    ~^POST:/v1/auth/(register|resend-verification)$ mail;
    ~^POST:/v1/auth/password-reset/request$ mail;
    ~^POST:/v1/auth/password-reset/confirm$ account;
}

map $metaguard_registration_route $metaguard_registration_mail_ip {
    default "";
    mail $binary_remote_addr;
}

map $metaguard_registration_route $metaguard_registration_mail_total {
    default "";
    mail registration-preview;
}

limit_req_zone $metaguard_registration_mail_ip zone=registration_mail_ip:1m rate=2r/m;
limit_req_zone $metaguard_registration_mail_total zone=registration_mail_total:1m rate=2r/m;
