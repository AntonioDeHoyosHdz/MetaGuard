user www-data;
worker_processes 1;
daemon off;
pid /run/metaguard-public-web/nginx.pid;
error_log stderr crit;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log off;
    default_type text/plain;
    client_header_timeout 8s;
    send_timeout 8s;
    keepalive_timeout 10s;
    client_max_body_size 1k;
    client_body_temp_path /run/metaguard-public-web/body;
    proxy_temp_path /run/metaguard-public-web/proxy;
    fastcgi_temp_path /run/metaguard-public-web/fastcgi;
    uwsgi_temp_path /run/metaguard-public-web/uwsgi;
    scgi_temp_path /run/metaguard-public-web/scgi;
    ssl_protocols TLSv1.2 TLSv1.3;
    limit_req_zone $binary_remote_addr zone=public_requests:1m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=public_connections:1m;

    server {
        listen __FRONTEND_PRIVATE_IPV4__:443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 404;
    }

    server {
        listen __FRONTEND_PRIVATE_IPV4__:443 ssl;
        server_name metaguard.duckdns.org;
        ssl_certificate /etc/letsencrypt/live/metaguard.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/metaguard.duckdns.org/privkey.pem;
        root /opt/metaguard-public/frontend;
        disable_symlinks on from=/opt/metaguard-public/frontend;
        limit_req zone=public_requests burst=12 nodelay;
        limit_req_status 429;
        limit_conn public_connections 8;
        limit_conn_status 429;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

        if ($http_host !~ "^metaguard\.duckdns\.org(?::443)?$") { return 404; }
        if ($request_method !~ "^(GET|HEAD)$") { return 405; }
        location = / { try_files /index.html =404; }
        location = /index.html { try_files $uri =404; }
        location = /security/events { try_files /index.html =404; }
        location = /assets/index-H4sokNT7.js { alias /opt/metaguard-public/frontend/assets/index-H4sokNT7.js; }
        location = /assets/index-ZwNNmTDN.css { alias /opt/metaguard-public/frontend/assets/index-ZwNNmTDN.css; }
        location / { return 404; }
    }
}
