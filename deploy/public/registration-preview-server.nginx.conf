# Include only in the named HTTPS server, after recording the operator /32.
# Requires registration-preview-http.nginx.conf and the existing Origin validator.
location ^~ /v1/auth/ {
    if ($metaguard_registration_route = blocked) { return 404; }
    # Reject before the preaccess rate limiter so other visitors cannot spend the mail quota.
    if ($metaguard_registration_operator != 1) { return 403; }
    if ($metaguard_invalid_origin = 1) { return 403; }

    allow __REGISTRATION_CLIENT_IPV4__/32;
    deny all;
    limit_req zone=public_requests burst=12 nodelay;
    limit_req zone=registration_mail_ip burst=2 nodelay;
    limit_req zone=registration_mail_total burst=2 nodelay;
    client_max_body_size 8k;
    proxy_pass https://__REGISTRATION_BACKEND_PRIVATE_IPV4__:8011;
    proxy_http_version 1.1;
    proxy_set_header Host metaguard.duckdns.org;
    proxy_set_header Connection "";
    proxy_set_header Origin $metaguard_request_origin;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Real-IP "";
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_name metaguard-registration.internal;
    proxy_ssl_server_name on;
    proxy_ssl_trusted_certificate __REGISTRATION_CA_FILE__;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_buffering off;
    proxy_cache off;
    proxy_redirect off;
}
